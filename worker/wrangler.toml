# Настройки сервера магазина DawnLine (Cloudflare Workers)
name = "dawnline"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true

[vars]
SITE_URL = "https://danill228228.github.io/rusforma_vehicles_cfgeventspawn/"
ADMIN_STEAM_IDS = ""   # можно не заполнять: админ назначается одноразовым кодом ADMIN_CLAIM_CODE

# Данные магазина: SQLite внутри Durable Object (доступно на бесплатном тарифе)
[[durable_objects.bindings]]
name = "SHOP"
class_name = "Shop"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Shop"]

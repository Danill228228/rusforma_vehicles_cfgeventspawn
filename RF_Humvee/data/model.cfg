// model.cfg для rf_humvee.p3d — лежит рядом с P3D (RF_Humvee/data/).
// Здесь полностью описана анимация люка. Кости колёс/подвески/руля/стрелок приборов
// возьмите из model.cfg ванильного OffroadHatchback или из DayZ-Samples (Test_Vehicle)
// и вставьте в отмеченные места — имена селекций в humvee.obj уже совпадают с ванильными
// (wheel_1_1, wheel_1_2, wheel_2_1, wheel_2_2).

class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};

	class RF_Humvee_Skeleton: Default
	{
		skeletonInherit = "";
		skeletonBones[] =
		{
			"hatch_roof", "",
			// --- сюда кости колёс/подвески/руля из базового скелета машины ---
			"camo", ""
		};
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};

	class rf_humvee: Default
	{
		skeletonName = "RF_Humvee_Skeleton";
		sections[] = {"camo", "hatch_roof"};

		class Animations
		{
			// Крышка люка: поворот вокруг оси шарнира (2 точки "hatch_roof_axis" в LOD Memory).
			// 0 -> 0°, 1 -> -110° (крышка откидывается назад, за вертикаль).
			class hatch_roof
			{
				type = "rotation";
				source = "HatchRoof";
				selection = "hatch_roof";
				axis = "hatch_roof_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = 0;
				angle1 = -1.9198622;   // rad(110)
			};

			// --- сюда анимации колёс, амортизаторов, руля из базового model.cfg ---
		};
	};
};

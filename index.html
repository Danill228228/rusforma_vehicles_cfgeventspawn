<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DAWNLINE · Мастерская модов DayZ</title>
<meta name="description" content="DAWNLINE — мастерская модов для DayZ-серверов.">
<meta name="theme-color" content="#121826">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DAWNLINE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #121826;
    --bg-bottom: #1b1e42;
    --bar: #131a2a;
    --card: #1e2538;
    --card-2: #252c42;
    --panel: #2a3148;
    --input: #222a3c;
    --line: rgba(255, 255, 255, 0.07);
    --accent: #6366f1;
    --accent-2: #8486f8;
    --title: #6f6df2;
    --text: #e8eaf0;
    --muted: #9aa2b6;
    --star: #f5a524;
    --ok: #22c55e;
    --bad: #ef4444;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: var(--bg-top); }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: "Inter", "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background: linear-gradient(180deg, var(--bg-top) 0%, #161b35 45%, var(--bg-bottom) 100%) fixed;
    background-color: var(--bg-top);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
  :focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

  .wrap { width: 100%; max-width: 1040px; margin: 0 auto; padding: 0 20px; }

  /* ---------- Верхняя панель ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    padding-top: env(safe-area-inset-top);
    background: rgba(19, 26, 42, 0.96);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .topbar .wrap { display: flex; align-items: center; gap: 12px; height: 64px; }

  .brand { font-size: 20px; font-weight: 800; letter-spacing: 0.02em; color: var(--title); white-space: nowrap; }

  .nav { flex: 1; display: flex; justify-content: center; }

  .nav a {
    position: relative;
    padding: 8px 14px;
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
  }

  .nav a.active { color: var(--title); }

  .nav a.active::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -4px;
    width: 28px;
    height: 2px;
    border-radius: 2px;
    background: var(--accent);
    transform: translateX(-50%);
  }

  .tools { display: flex; align-items: center; gap: 8px; }

  .chip-bal {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 40px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
  }

  .chip-bal svg { color: var(--accent-2); }

  .sq {
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
  }

  .sq.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .sq svg.out { color: var(--accent-2); }
  [hidden] { display: none !important; }

  /* ---------- Секции ---------- */
  main { flex: 1; padding-bottom: 40px; }

  .section { padding-top: 48px; }
  .section:first-child { padding-top: 40px; }

  .sec-head { text-align: center; margin-bottom: 32px; }

  .sec-title {
    font-size: clamp(26px, 5vw, 34px);
    font-weight: 800;
    color: var(--title);
    line-height: 1.15;
    text-wrap: balance;
  }

  .sec-sub { margin-top: 10px; color: var(--text); opacity: 0.85; font-size: 15px; }

  /* ---------- Продукты ---------- */
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }

  .product {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .product:hover { transform: translateY(-2px); border-color: rgba(99, 102, 241, 0.4); box-shadow: 0 12px 30px -12px rgba(0, 0, 0, 0.6); }

  .cover { position: relative; display: block; aspect-ratio: 2 / 1; background: #111725; overflow: hidden; }
  .cover img { width: 100%; height: 100%; object-fit: cover; }
  .cover .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  .cover .ph svg { width: 42px; height: 42px; opacity: 0.5; }

  .badge-gal {
    position: absolute;
    top: 14px;
    right: 14px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 10px;
    background: rgba(17, 23, 37, 0.88);
    font-size: 13px;
    font-weight: 500;
  }

  .badge-gal svg { width: 15px; height: 15px; }

  .p-body { flex: 1; padding: 24px 28px 0; }
  .p-title { font-size: 20px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }

  .p-desc {
    margin-top: 12px;
    color: var(--text);
    opacity: 0.85;
    font-size: 14px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .p-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 20px 28px 0;
    padding: 18px 0 22px;
    border-top: 1px solid var(--line);
    font-size: 14px;
    color: var(--muted);
  }

  .price { display: inline-flex; align-items: center; gap: 6px; color: var(--text); opacity: 0.9; }
  .cur { color: var(--accent-2); font-weight: 700; }
  .likes { display: inline-flex; align-items: center; gap: 6px; }
  .likes svg { width: 16px; height: 16px; }
  .likes.on { color: #fb7185; }
  .likes.on svg { fill: currentColor; }

  .empty {
    padding: 40px 20px;
    border: 1px dashed rgba(255, 255, 255, 0.12);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }

  .empty b { display: block; margin-bottom: 4px; color: var(--text); font-size: 17px; }
  .grid .empty { grid-column: 1 / -1; }

  /* ---------- Отзывы ---------- */
  .reviews { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }

  .review {
    padding: 26px 24px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
  }

  .r-head { display: flex; align-items: flex-start; gap: 12px; }

  .ava {
    flex: 0 0 auto;
    width: 38px;
    height: 38px;
    border-radius: 6px;
    object-fit: cover;
    background: var(--card-2);
    display: grid;
    place-items: center;
    font-weight: 800;
    color: var(--accent-2);
  }

  .r-who { flex: 1; min-width: 0; }
  .r-name { font-weight: 700; font-size: 15px; overflow-wrap: break-word; word-break: break-word; }
  .r-date { color: var(--muted); font-size: 12.5px; }
  .r-date a { color: var(--accent-2); }
  .stars { color: var(--star); white-space: nowrap; letter-spacing: 1px; font-size: 17px; }
  .stars .off { color: rgba(245, 165, 36, 0.25); }

  .r-text {
    margin-top: 16px;
    font-size: 14.5px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .reviews.full .r-text { -webkit-line-clamp: unset; display: block; }

  .center { display: flex; justify-content: center; margin-top: 30px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 22px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card-2);
    font-size: 14px;
    font-weight: 600;
    transition: filter 0.2s ease, box-shadow 0.2s ease;
  }

  .btn:hover { filter: brightness(1.12); }
  .btn.primary { border: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #fff; box-shadow: 0 8px 22px -10px rgba(99, 102, 241, 0.9); }
  .btn.indigo { border: 0; background: var(--accent-2); color: #fff; }
  .btn.danger { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.4); color: #fca5a5; }
  .btn.small { padding: 7px 13px; font-size: 13px; border-radius: 8px; }
  .btn:disabled { opacity: 0.55; cursor: default; filter: none; }

  .steam {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 22px;
    border: 1px solid #66c0f4;
    border-radius: 10px;
    background: linear-gradient(180deg, #2a475e, #1b2838);
    color: #fff;
    font-weight: 700;
  }

  /* ---------- Discord ---------- */
  .discord-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 22px 24px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
  }

  .discord-bar > svg { width: 30px; height: 30px; fill: var(--accent-2); flex: 0 0 auto; }
  .discord-bar span { flex: 1; font-weight: 600; font-size: 15px; }
  .discord-bar .btn svg { width: 18px; height: 18px; fill: currentColor; }

  /* ---------- Подвал ---------- */
  footer { border-top: 1px solid var(--line); background: rgba(19, 26, 42, 0.6); }
  footer .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 26px; padding-bottom: calc(26px + env(safe-area-inset-bottom)); font-size: 14px; }
  footer nav { display: flex; gap: 28px; }
  footer nav a:hover { color: var(--accent-2); }

  /* ---------- Страница продукта ---------- */
  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--accent-2); font-weight: 600; font-size: 14px; margin: 26px 0 16px; }
  .pp { display: grid; grid-template-columns: 1.25fr 1fr; gap: 28px; align-items: start; }
  .gallery .main { position: relative; aspect-ratio: 16 / 10; border-radius: var(--radius); overflow: hidden; background: #111725; border: 1px solid var(--line); cursor: zoom-in; }
  .gallery .main img { width: 100%; height: 100%; object-fit: cover; }
  .gallery .main .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  .gallery .main .ph svg { width: 48px; height: 48px; opacity: 0.5; }
  .thumbs { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; }
  .thumbs button { flex: 0 0 auto; width: 84px; height: 54px; padding: 0; border: 2px solid transparent; border-radius: 8px; overflow: hidden; background: #111725; }
  .thumbs button.on { border-color: var(--accent); }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; }

  .card {
    padding: 26px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
  }

  .pp h1 { font-size: clamp(24px, 4.5vw, 30px); font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
  .pp .meta { display: flex; gap: 16px; align-items: center; margin-top: 10px; color: var(--muted); font-size: 14px; }
  .big-price { margin: 18px 0 14px; font-size: 30px; font-weight: 800; }
  .big-price .cur { margin-left: 4px; }
  .note { color: var(--muted); font-size: 13.5px; margin-top: 10px; }
  .ok-text { color: #86efac; font-weight: 700; }
  .desc { margin-top: 26px; white-space: pre-wrap; font-size: 15px; overflow-wrap: anywhere; }
  .like-btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card-2); font-size: 14px; }
  .like-btn svg { width: 17px; height: 17px; }
  .like-btn.on { color: #fb7185; }
  .like-btn.on svg { fill: currentColor; }

  .rev-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .pick { display: inline-flex; flex-direction: row-reverse; justify-content: flex-end; gap: 2px; }
  .pick input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .pick span { font-size: 28px; color: rgba(245, 165, 36, 0.25); cursor: pointer; }
  .pick label:hover span, .pick label:hover ~ label span, .pick input:checked + span, .pick label:has(input:checked) ~ label span { color: var(--star); }

  /* ---------- Кабинет / верификация ---------- */
  .ucp { max-width: 760px; margin: 34px auto 0; }

  .ver { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: #1f2539; box-shadow: 0 20px 50px -25px rgba(0, 0, 0, 0.7); }

  .ver-top {
    padding: 44px 24px 40px;
    text-align: center;
    background: linear-gradient(135deg, #2c3352 0%, #262d47 100%);
  }

  .ver-ic {
    display: grid;
    place-items: center;
    width: 94px;
    height: 94px;
    margin: 0 auto 26px;
    border-radius: 50%;
    background: var(--accent-2);
    color: #fff;
  }

  .ver-ic svg { width: 44px; height: 44px; }

  .ver-top h1 {
    font-size: clamp(26px, 5.5vw, 38px);
    font-weight: 800;
    line-height: 1.15;
    background: linear-gradient(90deg, #f1f2f8 0%, #b8b9f7 60%, #9a9cf7 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .ver-top p { margin-top: 12px; font-size: 15px; opacity: 0.9; }

  .ver-body { padding: 30px; }
  .panel { padding: 28px 30px; border-radius: 12px; background: var(--panel); }

  .panel h2 { padding-bottom: 14px; margin-bottom: 22px; border-bottom: 1px solid var(--line); font-size: 18px; font-weight: 700; }
  .panel h2:not(:first-child) { margin-top: 34px; }

  .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .field > span { font-size: 13.5px; font-weight: 700; }
  .field small { color: var(--muted); font-size: 12px; }

  .field input, .field textarea, .field select {
    width: 100%;
    min-width: 0;
    padding: 12px 18px;
    border: 1px solid transparent;
    border-radius: 9px;
    background: var(--input);
    font-size: 16px;
    color: var(--text);
  }

  .field input::placeholder, .field textarea::placeholder { color: #8a93a8; }
  .field textarea { min-height: 130px; resize: vertical; }
  .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .row3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 14px; }
  .err { color: #fca5a5; font-size: 13.5px; min-height: 1.2em; margin-bottom: 8px; }

  .status-box { text-align: center; padding: 10px 0 4px; }
  .status-box p { color: var(--muted); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 18px 0; font-size: 14.5px; text-align: left; }
  .kv dt { color: var(--muted); }
  .kv dd { overflow-wrap: anywhere; }

  .stack { display: flex; flex-direction: column; gap: 18px; }
  .profile { display: flex; align-items: center; gap: 14px; }
  .profile .ava { width: 54px; height: 54px; border-radius: 10px; font-size: 22px; }
  .profile .who { flex: 1; min-width: 0; }
  .profile b { font-size: 18px; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
  .muted { color: var(--muted); font-size: 13.5px; }

  .bal-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 16px; }
  .bal-head h2, .card h2 { font-size: 18px; font-weight: 700; }
  .bal-num { font-size: 28px; font-weight: 800; }
  .quick { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .quick button { padding: 7px 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--card-2); font-weight: 600; font-size: 14px; }
  .inline { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
  .inline .field { flex: 1; margin: 0; min-width: 140px; }

  .notice { margin: 14px 0; padding: 14px 16px; border-radius: 10px; background: rgba(99, 102, 241, 0.13); border: 1px solid rgba(99, 102, 241, 0.35); font-size: 14px; }
  .code { padding: 2px 8px; border: 1px dashed var(--accent-2); border-radius: 7px; background: rgba(99, 102, 241, 0.15); color: #c7c8fb; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; font-size: 13px; }
  .boosty { background: #f15f2c !important; }

  .rows { list-style: none; }
  .rows li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 14px; flex-wrap: wrap; }
  .rows li:first-child { border-top: 0; }
  .plus { color: #86efac; font-weight: 700; }
  .minus { color: #fca5a5; font-weight: 700; }
  details summary { cursor: pointer; color: var(--accent-2); font-weight: 600; font-size: 14px; }
  details[open] summary { margin-bottom: 10px; }

  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #475069; }
  .pill.ok { background: var(--ok); }
  .pill.wait { background: #ca8a04; }
  .pill.bad { background: var(--bad); }

  /* ---------- Админка ---------- */
  .adm h2 { margin-bottom: 14px; }
  .adm .sub { margin: 22px 0 10px; font-size: 15px; font-weight: 700; color: var(--accent-2); }
  .prod-row { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .prod-row:first-of-type { border-top: 0; }
  .prod-row img, .prod-row .thumb-ph { width: 70px; height: 40px; border-radius: 6px; object-fit: cover; background: #111725; flex: 0 0 auto; }
  .prod-row .t { flex: 1; min-width: 0; }
  .img-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .img-list .im { position: relative; width: 96px; height: 60px; border-radius: 8px; overflow: hidden; background: #111725; }
  .img-list img { width: 100%; height: 100%; object-fit: cover; }
  .img-list button { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border: 0; border-radius: 6px; background: rgba(0, 0, 0, 0.7); color: #fff; font-size: 12px; }

  dialog {
    width: min(620px, calc(100vw - 20px));
    max-height: calc(100dvh - 20px);
    margin: auto;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--card);
    color: var(--text);
    box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.85);
  }

  dialog::backdrop { background: rgba(5, 8, 18, 0.75); }
  .dlg { padding: 24px; overflow: auto; max-height: calc(100dvh - 22px); }
  .dlg h2 { font-size: 20px; margin-bottom: 18px; }
  .dlg-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 8px; }
  .dlg-actions .sp { flex: 1; }
  #lightbox { width: min(1100px, calc(100vw - 16px)); background: #000; }
  #lightbox img { width: 100%; max-height: calc(100dvh - 80px); object-fit: contain; }
  .lb-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px; gap: 8px; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom));
    z-index: 60;
    max-width: calc(100vw - 32px);
    padding: 12px 18px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #262e45;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.7);
    transform: translate(-50%, 20px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .doc { max-width: 760px; margin: 34px auto 0; }
  .doc h1 { font-size: 28px; font-weight: 800; color: var(--title); margin-bottom: 18px; }
  .doc h2 { font-size: 17px; margin: 22px 0 8px; }
  .doc p, .doc li { color: var(--text); opacity: 0.9; font-size: 15px; }
  .doc ul { margin-left: 20px; }

  /* ---------- Телефон ---------- */
  @media (max-width: 640px) {
    .wrap { padding: 0 12px; }
    .topbar .wrap { height: 58px; gap: 8px; }
    .brand { font-size: 17px; }
    .nav a { padding: 6px 4px; font-size: 13px; }
    .chip-bal { height: 36px; padding: 0 10px; font-size: 13px; }
    .sq { width: 36px; height: 36px; }
    .grid, .reviews { gap: 14px; }
    .p-body { padding: 16px 14px 0; }
    .p-title { font-size: 16px; }
    .p-desc { font-size: 12.5px; margin-top: 8px; }
    .p-foot { margin: 14px 14px 0; padding: 12px 0 14px; font-size: 13px; }
    .badge-gal { top: 8px; right: 8px; padding: 4px 9px; font-size: 11.5px; }
    .review { padding: 16px 14px; }
    .stars { font-size: 13px; }
    .r-head { flex-wrap: wrap; gap: 10px; }
    .r-head .stars { flex-basis: 100%; order: 3; }
    .ava { width: 34px; height: 34px; }
    .r-text { font-size: 13px; margin-top: 12px; }
    .discord-bar { padding: 16px; gap: 12px; flex-wrap: wrap; }
    .discord-bar span { font-size: 14px; min-width: 150px; }
    .pp { grid-template-columns: 1fr; gap: 18px; }
    .ver-body { padding: 16px; }
    .panel { padding: 20px 16px; }
    .row3 { grid-template-columns: 1fr 1fr; }
    .row3 .field:first-child { grid-column: 1 / -1; }
    footer nav { gap: 18px; }
    .card { padding: 18px 16px; }
  }

  @media (max-width: 380px) {
    .reviews { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#/">DAWNLINE</a>
    <nav class="nav"><a href="#/" id="navHome">Главная</a></nav>
    <div class="tools">
      <a class="chip-bal" id="balChip" href="#/ucp" hidden><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v2"/><path d="M3 7v10a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2z"/><circle cx="16" cy="13.5" r="1.2" fill="currentColor"/></svg><span id="balText">0</span></a>
      <a class="sq" id="profileBtn" href="#/ucp" title="Личный кабинет" aria-label="Личный кабинет"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></a>
      <button class="sq" id="logoutBtn" type="button" title="Выйти" aria-label="Выйти" hidden><svg class="i out" viewBox="0 0 24 24"><path d="M15 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg></button>
    </div>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap">
    <span id="copy">DAWNLINE © 2026 ❤️</span>
    <nav><a href="#/terms">Условия</a><a href="#/privacy">Конфиденциальность</a></nav>
  </div>
</footer>

<dialog id="modal"><div class="dlg" id="modalBody"></div></dialog>
<dialog id="lightbox"><img id="lbImg" alt=""><div class="lb-bar"><button class="btn small" type="button" id="lbPrev">← Назад</button><span class="muted" id="lbCount"></span><button class="btn small" type="button" id="lbNext">Дальше →</button><button class="btn small" type="button" data-close>Закрыть</button></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   НАСТРОЙКИ
   ===================================================================== */
const CONFIG = {
  name: "DAWNLINE",
  api: "https://dawnline.rpor87707.workers.dev",   // сервер магазина (Cloudflare Worker)
  discordUrl: "#",                                  // ссылка-приглашение в Discord
  currencySign: "zł"
};

/* =====================================================================
   Утилиты
   ===================================================================== */
const $ = id => document.getElementById(id);
const app = $("app");

function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* без хранилища */ } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* без хранилища */ } }

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const money = n => `${Number(n || 0).toLocaleString("ru-RU")} ${CONFIG.currencySign}`;
const date = ts => { try { return new Date(ts).toLocaleDateString("ru-RU"); } catch (e) { return ""; } };
const dateTime = ts => { try { return new Date(ts).toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };
const imgUrl = u => (/^img\/[a-z0-9]{16}$/.test(u || "") ? `${CONFIG.api}/${u}` : /^https:\/\//.test(u || "") ? u : "");
const safeHttps = u => (/^https:\/\//i.test(u || "") ? u : "");

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}

const ICON = {
  image: '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5-5-8 8"/></svg>',
  heart: '<svg class="i" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9.2-8.6C1.2 8.2 3 4.5 6.6 4.5c2.1 0 3.5 1.2 5.4 3.3 1.9-2.1 3.3-3.3 5.4-3.3 3.6 0 5.4 3.7 3.8 6.9C19 15.6 12 20 12 20z"/></svg>',
  chat: '<svg class="i" viewBox="0 0 24 24"><path d="M21 12a7 7 0 0 1-10.3 6.2L5 20l1.6-4.6A7 7 0 1 1 21 12z"/><path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01"/></svg>',
  back: '<svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
  send: '<svg class="i" viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M2.5 11.2 21 3.5l-4.2 17.2-5.1-5.1-3.4 3.3.4-4.9L17 6.5 7.3 12.9z"/></svg>',
  shield: '<svg class="i" viewBox="0 0 24 24" style="stroke-width:2.2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6 1.3 0 2.5.3 3.5.9"/><path d="M17.5 12.5l4 1.5v3c0 2.4-1.7 4-4 5-2.3-1-4-2.6-4-5v-3z"/></svg>',
  discord: '<svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.7 19.7 0 0 0 15.4 3l-.6 1.3a18.3 18.3 0 0 0-5.6 0L8.6 3a19.6 19.6 0 0 0-4.9 1.4C.6 9 -.3 13.6.2 18.1a19.8 19.8 0 0 0 6 3l1.3-2a12.8 12.8 0 0 1-2-1l.5-.4a14.1 14.1 0 0 0 12 0l.5.4c-.6.4-1.3.7-2 1l1.3 2a19.7 19.7 0 0 0 6-3c.6-5.2-.8-9.7-3.5-13.7ZM8.5 15.3c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.2 1.1 2.1 2.4c0 1.3-.9 2.4-2.1 2.4Zm7 0c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.2 1.1 2.1 2.4c0 1.3-.9 2.4-2.1 2.4Z"/></svg>'
};

const stars = r => `<span class="stars" aria-label="Оценка ${r} из 5">${"★".repeat(r)}<span class="off">${"★".repeat(5 - r)}</span></span>`;
const avatar = u => /^https:\/\//.test(u.avatar || "")
  ? `<img class="ava" src="${esc(u.avatar)}" alt="" loading="lazy" referrerpolicy="no-referrer">`
  : `<span class="ava" aria-hidden="true">${esc((u.name || "?").slice(0, 1).toUpperCase())}</span>`;

/* =====================================================================
   Сервер
   ===================================================================== */
const S = {
  token: lsGet("dl-token", ""),
  user: null,
  products: null,
  likes: new Set(),
  purchases: [],
  money: null,
  admin: null,
  adminUser: null,
  topup: null,
  latest: null,
  page: {}
};

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (S.token) headers.Authorization = `Bearer ${S.token}`;
  if (opts.body) headers["Content-Type"] = "application/json";
  const res = await fetch(CONFIG.api + path, { ...opts, headers, cache: "no-store" });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && S.token) logout(true);
  if (!res.ok) throw new Error(data.error || `Ошибка ${res.status}`);
  return data;
}

const post = (path, data) => api(path, { method: "POST", body: JSON.stringify(data || {}) });

async function loadProducts() {
  try { S.products = (await api("/products")).products; } catch (e) { S.products = S.products || []; toast("Не удалось загрузить продукты"); }
}

async function loadLatest() {
  try { S.latest = (await api("/reviews?limit=6")).reviews; } catch (e) { S.latest = []; }
}

async function refreshUser() {
  if (!S.token) { S.user = null; return; }
  try {
    const [me, likes, purchases] = await Promise.all([api("/me"), api("/likes/mine"), api("/purchases")]);
    S.user = me;
    S.likes = new Set(likes.likes || []);
    S.purchases = purchases.purchases || [];
  } catch (e) { /* токен устарел */ }
}

function login() {
  lsSet("dl-back", location.hash && !/steam/.test(location.hash) ? location.hash : "#/ucp");
  location.href = CONFIG.api + "/auth/steam";
}

function logout(silent) {
  S.token = ""; S.user = null; S.likes = new Set(); S.purchases = []; S.money = null; S.admin = null; S.adminUser = null; S.topup = null;
  lsDel("dl-token");
  renderHeader();
  if (!silent) { toast("Ты вышел из аккаунта"); render(); }
}

/* =====================================================================
   Маршруты: #/ · #/product/id · #/reviews · #/ucp · #/admin · #/terms · #/privacy
   ===================================================================== */
function parseHash() {
  const h = location.hash.replace(/^#/, "") || "/";
  const [path, query] = h.split("?");
  return { path: path || "/", query: new URLSearchParams(query || "") };
}

function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }

async function render() {
  const { path } = parseHash();
  $("navHome").classList.toggle("active", path === "/" || path.startsWith("/product") || path === "/reviews");
  $("profileBtn").classList.toggle("on", path === "/ucp" || path === "/admin");
  const p = path.match(/^\/product\/([\w-]+)$/);
  if (p) await renderProduct(p[1]);
  else if (path === "/reviews") await renderAllReviews();
  else if (path === "/ucp") await renderUcp();
  else if (path === "/admin") await renderAdmin();
  else if (path === "/terms") renderTerms();
  else if (path === "/privacy") renderPrivacy();
  else await renderHome();
}

function renderHeader() {
  const u = S.user;
  $("balChip").hidden = !u;
  $("logoutBtn").hidden = !u;
  if (u) $("balText").textContent = money(u.balance);
}

/* =====================================================================
   Главная
   ===================================================================== */
function productCard(p) {
  const img = imgUrl(p.images[0]);
  return `
    <a class="product" href="#/product/${esc(p.id)}">
      <div class="cover">
        ${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : `<span class="ph">${ICON.image}</span>`}
        ${p.images.length ? `<span class="badge-gal">${ICON.image}Галерея</span>` : ""}
      </div>
      <div class="p-body">
        <h3 class="p-title">${esc(p.title)}</h3>
        ${p.description ? `<p class="p-desc">${esc(p.description)}</p>` : ""}
      </div>
      <div class="p-foot">
        <span class="price"><span class="cur">${esc(CONFIG.currencySign)}</span>${esc(Number(p.price).toLocaleString("ru-RU"))}</span>
        <span class="likes${S.likes.has(p.id) ? " on" : ""}">${ICON.heart}${esc(p.likes)}</span>
      </div>
    </a>`;
}

function reviewCard(r, withProduct) {
  return `
    <article class="review">
      <div class="r-head">
        ${avatar(r)}
        <div class="r-who">
          <div class="r-name">${esc(r.name || "Игрок")}</div>
          <div class="r-date">${esc(date(r.ts))}${withProduct && r.title ? ` · <a href="#/product/${esc(r.mod)}">${esc(r.title)}</a>` : ""}</div>
        </div>
        ${stars(r.rating)}
      </div>
      <p class="r-text">${esc(r.text)}</p>
    </article>`;
}

function discordBlock() {
  return `
    <section class="section">
      <div class="sec-head"><h2 class="sec-title">Наше сообщество Discord</h2><p class="sec-sub">Будьте в курсе всего...</p></div>
      <div class="discord-bar">${ICON.discord}<span>Остались вопросы? Присоединяйтесь к нашему Discord!</span>
        <a class="btn indigo small" href="${esc(CONFIG.discordUrl)}" target="_blank" rel="noopener">${ICON.discord}Присоединиться</a></div>
    </section>`;
}

async function renderHome() {
  document.title = `${CONFIG.name} · Мастерская модов DayZ`;
  if (!S.products) await loadProducts();
  if (!S.latest) await loadLatest();
  const list = S.products || [];
  app.innerHTML = `
    <div class="wrap">
      <section class="section">
        <div class="sec-head"><h1 class="sec-title">Продукты мастерской</h1><p class="sec-sub">Доступные продукты мастерской...</p></div>
        <div class="grid">${list.length ? list.map(productCard).join("") : `<div class="empty"><b>Скоро здесь появятся продукты</b>Мастерская готовит первые моды.</div>`}</div>
      </section>
      <section class="section">
        <div class="sec-head"><h2 class="sec-title">Отзывы пользователей</h2><p class="sec-sub">Что говорят наши пользователи...</p></div>
        ${S.latest.length ? `<div class="reviews">${S.latest.map(r => reviewCard(r, true)).join("")}</div>
          <div class="center"><a class="btn" href="#/reviews">${ICON.chat}Просмотреть все отзывы</a></div>`
          : `<div class="empty"><b>Отзывов пока нет</b>Их оставляют покупатели после покупки.</div>`}
      </section>
      ${discordBlock()}
    </div>`;
}

async function renderAllReviews() {
  document.title = `Отзывы · ${CONFIG.name}`;
  let list = [];
  app.innerHTML = `<div class="wrap"><p class="muted" style="padding:40px 0">Загружаю…</p></div>`;
  try { list = (await api("/reviews?limit=100")).reviews; } catch (e) { toast(e.message); }
  app.innerHTML = `
    <div class="wrap">
      <a class="back" href="#/">${ICON.back}На главную</a>
      <div class="sec-head"><h1 class="sec-title">Все отзывы</h1><p class="sec-sub">Что говорят наши пользователи...</p></div>
      ${list.length ? `<div class="reviews full">${list.map(r => reviewCard(r, true)).join("")}</div>` : `<div class="empty"><b>Отзывов пока нет</b></div>`}
    </div>`;
}

/* =====================================================================
   Страница продукта
   ===================================================================== */
const owned = id => S.purchases.some(p => p.mod === id);
const verified = () => !!(S.user && S.user.verification && S.user.verification.status === "approved");

function buyBox(p) {
  const u = S.user;
  if (!u) return `<button class="steam" type="button" data-act="login">Войти через Steam, чтобы купить</button>`;
  if (owned(p.id)) {
    const x = S.purchases.find(q => q.mod === p.id) || {};
    return `<p class="ok-text">✓ Продукт куплен</p>
      ${safeHttps(x.url) ? `<p style="margin-top:12px"><a class="btn primary" href="${esc(safeHttps(x.url))}" target="_blank" rel="noopener">Скачать</a></p>` : ""}
      ${x.note ? `<p class="note" style="white-space:pre-wrap">${esc(x.note)}</p>` : (!x.url ? `<p class="note">Ссылка на скачивание скоро появится в личном кабинете.</p>` : "")}`;
  }
  if (!verified()) return `<a class="btn primary" href="#/ucp">Пройти верификацию</a><p class="note">Покупать могут только владельцы DayZ-серверов, прошедшие верификацию.</p>`;
  if (u.balance < p.price) return `<a class="btn primary" href="#/ucp">Пополнить баланс</a><p class="note">На балансе ${esc(money(u.balance))}, не хватает ${esc(money(p.price - u.balance))}.</p>`;
  return `<button class="btn primary" type="button" data-act="buy" data-id="${esc(p.id)}">${p.price === 0 ? "Получить бесплатно" : `Купить за ${esc(money(p.price))}`}</button><p class="note">На балансе ${esc(money(u.balance))}</p>`;
}

async function renderProduct(id) {
  if (!S.page[id]) {
    app.innerHTML = `<div class="wrap"><p class="muted" style="padding:40px 0">Загружаю…</p></div>`;
    try { S.page[id] = await api(`/products/${encodeURIComponent(id)}`); }
    catch (e) {
      app.innerHTML = `<div class="wrap"><a class="back" href="#/">${ICON.back}Все продукты</a><div class="empty"><b>Продукт не найден</b>${esc(e.message)}</div></div>`;
      return;
    }
  }
  const { product: p, reviews } = S.page[id];
  document.title = `${p.title} · ${CONFIG.name}`;
  const imgs = p.images.map(imgUrl).filter(Boolean);
  const mine = S.user && reviews.find(r => r.steamid === S.user.steamid);
  const canReview = S.user && owned(p.id) && !S.user.banned;
  const rating = mine ? mine.rating : 5;
  app.innerHTML = `
    <div class="wrap">
      <a class="back" href="#/">${ICON.back}Все продукты</a>
      <div class="pp">
        <div class="gallery">
          <div class="main" data-lb="0">${imgs[0] ? `<img id="mainImg" src="${esc(imgs[0])}" alt="${esc(p.title)}">` : `<span class="ph">${ICON.image}</span>`}</div>
          ${imgs.length > 1 ? `<div class="thumbs">${imgs.map((src, i) => `<button type="button" data-thumb="${i}" class="${i ? "" : "on"}" aria-label="Фото ${i + 1}"><img src="${esc(src)}" alt="" loading="lazy"></button>`).join("")}</div>` : ""}
        </div>
        <div class="card">
          <h1>${esc(p.title)}</h1>
          <div class="meta">
            ${p.rating ? `<span>${stars(Math.round(p.rating.avg))} ${esc(p.rating.avg)} · ${esc(p.rating.n)}</span>` : `<span>Пока без отзывов</span>`}
          </div>
          <div class="big-price">${esc(Number(p.price).toLocaleString("ru-RU"))}<span class="cur">${esc(CONFIG.currencySign)}</span></div>
          <div>${buyBox(p)}</div>
          <p style="margin-top:18px"><button class="like-btn${S.likes.has(p.id) ? " on" : ""}" type="button" data-act="like" data-id="${esc(p.id)}" aria-pressed="${S.likes.has(p.id)}">${ICON.heart}<span>${esc(p.likes)}</span></button></p>
        </div>
      </div>
      ${p.description ? `<div class="card desc">${esc(p.description)}</div>` : ""}
      <section class="section">
        <div class="sec-head"><h2 class="sec-title">Отзывы</h2></div>
        ${canReview ? `
          <form class="card rev-form" data-form="review" data-id="${esc(p.id)}">
            <b>${mine ? "Твой отзыв" : "Оставь отзыв"}</b>
            <div class="pick" role="radiogroup" aria-label="Оценка">${[5, 4, 3, 2, 1].map(n => `<label><input type="radio" name="rating" value="${n}"${n === rating ? " checked" : ""}><span>★</span></label>`).join("")}</div>
            <div class="field" style="margin:0"><textarea name="text" maxlength="1000" placeholder="Как мод работает на твоём сервере?" required>${esc(mine ? mine.text : "")}</textarea></div>
            <div class="inline"><button class="btn primary small" type="submit">${mine ? "Обновить отзыв" : "Отправить отзыв"}</button>
            ${mine ? `<button class="btn danger small" type="button" data-act="del-review" data-id="${esc(p.id)}">Удалить</button>` : ""}</div>
          </form>` : ""}
        ${reviews.length ? `<div class="reviews full">${reviews.map(r => reviewCard(r, false)).join("")}</div>` : `<div class="empty"><b>Отзывов пока нет</b>Отзыв может оставить покупатель продукта.</div>`}
      </section>
    </div>`;
  LB.list = imgs;
}

/* =====================================================================
   Личный кабинет
   ===================================================================== */
const TX = { topup: "Пополнение", purchase: "Покупка", refund: "Возврат", admin: "Администратор" };

function claimBlock() {
  if (!S.user || !S.user.adminClaimable) return "";
  return `<details class="card" style="margin-top:18px"><summary>Я владелец магазина</summary>
    <form data-form="claim" class="inline" style="margin-top:12px">
      <label class="field"><input name="code" placeholder="Код администратора" autocomplete="off" required aria-label="Код администратора"></label>
      <button class="btn primary small" type="submit">Стать администратором</button>
    </form></details>`;
}

function verificationForm(v) {
  return `
    <div class="ver">
      <div class="ver-top">
        <div class="ver-ic">${ICON.shield}</div>
        <h1>Требуется верификация</h1>
        <p>Для доступа к личному кабинету необходимо пройти проверку</p>
      </div>
      <div class="ver-body">
        ${v && v.status === "rejected" ? `<div class="notice" style="margin-top:0">Прошлая заявка отклонена${v.note ? `: ${esc(v.note)}` : ""}. Исправь данные и отправь снова.</div>` : ""}
        <form class="panel" data-form="verify" novalidate>
          <h2>Информация о проекте</h2>
          <label class="field"><span>Название проекта *</span>
            <input name="project" placeholder="My DayZ Server" maxlength="40" value="${esc(v ? v.project : "")}" required>

        visible: f.visible === "1", images: editor.images, delivery: { url: f.url, note: f.note }
      });

  });
  $("modal").showModal();
}

function resizeImage(file, max, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("не удалось открыть файл")); };
    img.src = url;
  });
}

      <li>Из заявки на верификацию: название проекта, Discord ID, IP и порты сервера, описание проекта.</li>
      <li>Баланс, покупки, заявки на пополнение, отзывы и лайки.</li>
    </ul>
    <h2>Оплата</h2>
    <p>Онлайн-оплата проходит на стороне Stripe — данные карты мы не видим и не храним.</p>
    <h2>Зачем</h2>
    <p>Данные нужны только для работы магазина: входа, проверки покупателей, выдачи купленных продуктов. Мы не продаём и не передаём их третьим лицам.</p>
    <h2>Удаление</h2>
    <p>Чтобы удалить свои данные, напишите нам в Discord.</p>
  </article></div>`;
}

/* =====================================================================
   Действия
   ===================================================================== */
const LB = { list: [], i: 0 };
function showLb() { $("lbImg").src = LB.list[LB.i] || ""; $("lbCount").textContent = LB.list.length > 1 ? `${LB.i + 1} из ${LB.list.length}` : ""; }
$("lbPrev").addEventListener("click", () => { LB.i = (LB.i - 1 + LB.list.length) % LB.list.length; showLb(); });
$("lbNext").addEventListener("click", () => { LB.i = (LB.i + 1) % LB.list.length; showLb(); });

document.addEventListener("click", async e => {
  const t = e.target;
  if (t.closest("[data-close]")) { t.closest("dialog").close(); return; }
  if (t.tagName === "DIALOG") { t.close(); return; }

  const thumb = t.closest("[data-thumb]");
  if (thumb) {
    const i = Number(thumb.dataset.thumb);
    $("mainImg").src = LB.list[i];
    document.querySelector(".gallery .main").dataset.lb = i;
    document.querySelectorAll("[data-thumb]").forEach(b => b.classList.toggle("on", b === thumb));
    return;
  }
  const lb = t.closest("[data-lb]");
  if (lb && LB.list.length) { LB.i = Number(lb.dataset.lb) || 0; showLb(); $("lightbox").showModal(); return; }

  const amount = t.closest("[data-amount]");
  if (amount) { const inp = amount.closest("form").querySelector("[name=amount]"); inp.value = amount.dataset.amount; inp.focus(); return; }

  const el = t.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  try {
    if (act === "login") login();
    else if (act === "buy") {
      const p = S.page[el.dataset.id].product;
      if (!confirm(`Купить «${p.title}» за ${money(p.price)}?`)) return;
      el.disabled = true;
      await post("/buy", { mod: p.id });
      toast("Покупка прошла! Ссылка на скачивание — здесь и в личном кабинете");
      await refreshUser(); renderHeader(); S.money = null; render();
    } else if (act === "like") {
      if (!S.user) { login(); return; }
      const r = await post("/likes", { mod: el.dataset.id });
      if (r.liked) S.likes.add(el.dataset.id); else S.likes.delete(el.dataset.id);
      const pg = S.page[el.dataset.id];
      if (pg) pg.product.likes = Math.max(0, pg.product.likes + (r.liked ? 1 : -1));
      S.products = null;
      render();
    } else if (act === "del-review") {
      if (!confirm("Удалить твой отзыв?")) return;
      await api(`/reviews/${encodeURIComponent(el.dataset.id)}`, { method: "DELETE" });
      delete S.page[el.dataset.id]; S.latest = null; render();
    } else if (act === "ver") {
      let note = "";
      if (el.dataset.do === "reject") { note = prompt("Причина отказа (увидит игрок):", "Не удалось проверить сервер"); if (note === null) return; }
      await post("/admin/verification", { steamid: el.dataset.steamid, action: el.dataset.do, note });
      toast(el.dataset.do === "approve" ? "Верификация одобрена" : "Заявка отклонена");
      await loadAdmin(); renderAdmin();
    } else if (act === "topup") {
      if (el.dataset.do === "approve" && !confirm("Деньги действительно пришли? Баланс игрока будет пополнен.")) return;
      await post("/admin/topup", { id: Number(el.dataset.id), action: el.dataset.do });
      toast(el.dataset.do === "approve" ? "Баланс пополнен" : "Заявка отклонена");
      await loadAdmin(); renderAdmin();
    } else if (act === "refund") {
      if (!confirm("Вернуть деньги за этот продукт? Покупка и отзыв игрока будут удалены.")) return;
      await post("/admin/refund", { steamid: el.dataset.steamid, mod: el.dataset.mod });
      toast("Деньги возвращены");
      S.adminUser = await api(`/admin/user?steamid=${el.dataset.steamid}`);
      await loadAdmin(); renderAdmin();
    } else if (act === "ban") {
      if (!confirm("Заблокировать игрока? Он не сможет покупать и оставлять отзывы, его отзывы будут удалены.")) return;
      await post("/admin/ban", { steamid: el.dataset.steamid });
      toast("Игрок заблокирован");
      S.adminUser = await api(`/admin/user?steamid=${el.dataset.steamid}`);
      renderAdmin();
    } else if (act === "product-new") openProductEditor(null);
    else if (act === "product-edit") openProductEditor(el.dataset.id);
  } catch (err) {
    toast(err.message);
    el.disabled = false;
  }
});

document.addEventListener("input", e => {
  if (e.target.name === "about" && $("aboutCount")) $("aboutCount").textContent = e.target.value.length;
});

document.addEventListener("submit", async e => {
  const form = e.target.closest("form[data-form]");
  if (!form) return;
  e.preventDefault();
  const f = Object.fromEntries(new FormData(form));
  const btn = form.querySelector("[type=submit]");
  if (btn) btn.disabled = true;
  try {
    switch (form.dataset.form) {
      case "verify": {
        const err = $("verErr");
        err.textContent = "";
        if (!/^[A-Za-z ]{2,40}$/.test(f.project.trim())) { err.textContent = "Название проекта: только английские буквы и пробелы"; break; }
        if (!/^\d{17,20}$/.test(f.discord.trim())) { err.textContent = "Discord ID: только цифры (17–20 цифр)"; break; }
        if (f.about.trim().length < 10) { err.textContent = "Расскажите о проекте подробнее (от 10 символов)"; break; }
        const r = await post("/verify", { project: f.project, discord: f.discord, about: f.about, ip: f.ip, port: Number(f.port), qport: Number(f.qport) });
        S.user.verification = r.verification;
        toast("Заявка отправлена");
        renderUcp();
        break;
      }
      case "topup-card": {
        const r = await post("/topup/card", { amount: Number(f.amount) });
        location.href = r.url;
        return;
      }
      case "topup":
        S.topup = await post("/topup", { amount: Number(f.amount) });
        S.money = null;
        await loadMoney();
        break;
      case "review":
        await post("/reviews", { mod: form.dataset.id, rating: Number(f.rating), text: f.text });
        toast("Спасибо за отзыв!");
        delete S.page[form.dataset.id]; S.latest = null; S.products = null;
        render();
        break;
      case "claim":
        await post("/admin/claim", { code: f.code });
        toast("Теперь ты администратор");
        await refreshUser(); renderHeader(); renderUcp();
        break;
      case "find":
        S.adminUser = await api(`/admin/user?steamid=${encodeURIComponent(f.steamid.trim())}`);
        renderAdmin();
        break;
      case "balance":
        await post("/admin/balance", { steamid: f.steamid, amount: Number(f.amount), note: f.note });
        toast("Баланс изменён");
        S.adminUser = await api(`/admin/user?steamid=${f.steamid}`);
        if (S.user && f.steamid === S.user.steamid) { await refreshUser(); renderHeader(); S.money = null; }
        renderAdmin();
        break;
      case "settings":
        await post("/admin/settings", { boosty: f.boosty, paymentInfo: f.paymentInfo });
        toast("Сохранено");
        S.money = null;
        await loadAdmin(); renderAdmin();
        break;
    }
  } catch (err) {
    if (form.dataset.form === "verify" && $("verErr")) $("verErr").textContent = err.message; else toast(err.message);
  }
  if (btn && btn.isConnected) btn.disabled = false;
});

$("logoutBtn").addEventListener("click", () => { logout(false); go("#/"); });
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

/* =====================================================================
   Запуск
   ===================================================================== */
// Старая версия сайта работала офлайн через service worker — отключаем его
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
  if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
}

(async function start() {
  $("copy").textContent = `${CONFIG.name} © ${new Date().getFullYear()} ❤️`;
  const { query } = parseHash();

  // Возврат со страницы входа Steam: #/ucp?steam=ТОКЕН
  if (query.get("steam")) { S.token = query.get("steam"); lsSet("dl-token", S.token); }
  if (query.get("steam_error")) toast(query.get("steam_error") === "cancel" ? "Вход через Steam отменён" : "Не удалось войти через Steam");
  const topup = query.get("topup");
  const session = query.get("session");
  if (query.get("steam") || query.get("steam_error") || topup) {
    const back = query.get("steam") ? lsGet("dl-back", "#/ucp") : "#/ucp";
    lsDel("dl-back");
    history.replaceState(null, "", location.pathname + location.search + (/^#\/[\w/-]*$/.test(back) ? back : "#/ucp"));
  }

  await refreshUser();
  renderHeader();

  // Возврат со страницы оплаты Stripe
  if (topup === "cancel") toast("Оплата отменена");
  if (topup === "success" && session && S.token) {
    try {
      const r = await post("/topup/confirm", { session });
      toast(r.paid ? `Баланс пополнен на ${money(r.amount)}` : "Оплата ещё обрабатывается — баланс обновится сам");
    } catch (err) { toast(err.message); }
    await refreshUser(); renderHeader();
  }
  if (S.user && query.get("steam")) toast(`Добро пожаловать, ${S.user.name}!`);
  render();
})();
</script>

# Сервер магазина DAWNLINE (Cloudflare Workers)
name = "dawnline"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true

[vars]
SITE_URL = "https://danill228228.github.io/rusforma_vehicles_cfgeventspawn/"
ADMIN_STEAM_IDS = ""
BOOSTY_URL = "https://boosty.to/tufelka"
CURRENCY = "rub"
CURRENCY_SIGN = "₽"

# Данные магазина: SQLite внутри Durable Object (есть на бесплатном тарифе)
[[durable_objects.bindings]]
name = "SHOP"
class_name = "Shop"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Shop"]

# Настройки сервера комментариев DawnLine (Cloudflare Workers)
name = "dawnline-comments"
main = "src/index.js"
compatibility_date = "2024-09-23"

[vars]
SITE_URL = "https://danill228228.github.io/rusforma_vehicles_cfgeventspawn/"
ADMIN_STEAM_IDS = ""   # твой Steam ID (17 цифр); несколько — через запятую

[[d1_databases]]
binding = "DB"
database_name = "dawnline-comments"
database_id = "ВСТАВЬ_ID_БАЗЫ"

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дорожная карта сервера DawnLine</title>
<meta name="theme-color" content="#0d0618">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DawnLine">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #0d0618;
    --bg-2: #1a0b2e;
    --card: #241038;
    --card-2: #2c1446;
    --accent: #8b5cf6;
    --accent-soft: #c4b5fd;
    --text: #ede9fe;
    --muted: #a99cc9;
    --border: rgba(139, 92, 246, 0.28);
    --border-strong: rgba(139, 92, 246, 0.6);
    --glow: 0 0 0 1px rgba(139, 92, 246, 0.55), 0 10px 40px -8px rgba(139, 92, 246, 0.55);
    --done: #a78bfa;
    --radius: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    min-height: 100vh;
    font-family: "Rubik", "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    background-color: var(--bg-1);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* мягкие фиолетовые пятна на фоне */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(600px 400px at 15% 0%, rgba(139, 92, 246, 0.16), transparent 70%),
      radial-gradient(500px 500px at 100% 60%, rgba(196, 181, 253, 0.07), transparent 70%);
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 880px;
    margin: 0 auto;
    padding: 0 16px;
  }

  /* ---------- Верхнее меню ---------- */
  .topnav {
    position: sticky;
    top: 0;
    z-index: 10;
    padding-top: env(safe-area-inset-top);
    background: rgba(13, 6, 24, 0.82);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .topnav-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    max-width: 880px;
    margin: 0 auto;
    padding: 10px 16px;
  }

  .brand {
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 0.01em;
    color: var(--accent-soft);
    text-shadow: 0 0 18px rgba(139, 92, 246, 0.6);
    white-space: nowrap;
  }

  .seg {
    display: flex;
    gap: 4px;
    padding: 4px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: rgba(36, 16, 56, 0.7);
  }

  .seg a {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 14px;
    border-radius: 10px;
    color: var(--muted);
    font-size: 14.5px;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
    transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
  }

  .seg a:hover { color: var(--text); }

  .seg a[aria-current="page"] {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 0 16px rgba(139, 92, 246, 0.6);
  }

  .seg a:focus-visible {
    outline: 2px solid var(--accent-soft);
    outline-offset: 2px;
  }

  .view[hidden] { display: none; }

  /* ---------- Шапка ---------- */
  header {
    padding: 48px 0 36px;
    text-align: center;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(36, 16, 56, 0.6);
    color: var(--accent-soft);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .badge .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  h1 {
    margin: 18px 0 10px;
    font-size: clamp(28px, 6vw, 46px);
    font-weight: 800;
    line-height: 1.12;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  h1 .name {
    color: var(--accent-soft);
    text-shadow: 0 0 24px rgba(139, 92, 246, 0.6);
  }

  .subtitle {
    max-width: 560px;
    margin: 0 auto;
    color: var(--muted);
    font-size: clamp(15px, 2.5vw, 17px);
    text-wrap: pretty;
  }

  .overall {
    margin: 32px auto 0;
    max-width: 560px;
    padding: 18px 20px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: rgba(36, 16, 56, 0.75);
    text-align: left;
  }

  .overall-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 10px;
  }

  .overall-label {
    font-weight: 600;
    font-size: 15px;
  }

  .overall-count {
    color: var(--accent-soft);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    white-space: nowrap;
  }

  .bar {
    height: 12px;
    border-radius: 999px;
    background: rgba(13, 6, 24, 0.8);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    width: 0;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--accent), var(--accent-soft));
    box-shadow: 0 0 14px rgba(139, 92, 246, 0.8);
    transition: width 0.6s cubic-bezier(.2, .8, .2, 1);
  }

  /* ---------- Карточки ---------- */
  .roadmap {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding-bottom: 20px;
  }

  .card {
    position: relative;
    padding: 22px 22px 18px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    transition: box-shadow 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
  }

  .card:hover {
    border-color: var(--border-strong);
    box-shadow: var(--glow);
  }

  .card.complete {
    border-color: rgba(196, 181, 253, 0.55);
    background: linear-gradient(160deg, var(--card-2), var(--card));
  }

  /* появление при прокрутке */
  .reveal {
    opacity: 0;
    transform: translateY(24px);
  }

  .reveal.visible {
    opacity: 1;
    transform: none;
    transition: opacity 0.6s ease, transform 0.6s cubic-bezier(.2, .8, .2, 1), box-shadow 0.25s ease, border-color 0.25s ease;
  }

  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; }
    .bar-fill, .mini-fill { transition: none; }
    .badge .dot { animation: none; }
  }

  .card-head {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .icon {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: rgba(139, 92, 246, 0.14);
    border: 1px solid var(--border);
    font-size: 26px;
    line-height: 1;
  }

  .head-text {
    flex: 1 1 auto;
    min-width: 0;
  }

  .num {
    display: block;
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .card-title {
    font-size: clamp(17px, 3.2vw, 20px);
    font-weight: 700;
    line-height: 1.25;
    text-wrap: balance;
    overflow-wrap: anywhere;
  }

  .counter {
    flex: 0 0 auto;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(13, 6, 24, 0.55);
    color: var(--accent-soft);
    font-size: 14px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .card.complete .counter {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .card-note {
    margin-top: 14px;
    color: var(--muted);
    font-size: 15px;
    text-wrap: pretty;
  }

  .mini-bar {
    margin: 16px 0 6px;
    height: 4px;
    border-radius: 999px;
    background: rgba(13, 6, 24, 0.7);
    overflow: hidden;
  }

  .mini-fill {
    height: 100%;
    width: 0;
    background: var(--accent);
    border-radius: inherit;
    transition: width 0.5s ease;
  }

  .tasks {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 8px;
  }

  .task label {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 10px;
    margin: 0 -10px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .task label:hover {
    background: rgba(139, 92, 246, 0.09);
  }

  .task input {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
  }

  .check {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    margin-top: 1px;
    border-radius: 7px;
    border: 2px solid var(--border-strong);
    background: rgba(13, 6, 24, 0.6);
    transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .check svg {
    width: 14px;
    height: 14px;
    stroke: #fff;
    stroke-width: 3;
    fill: none;
    stroke-dasharray: 20;
    stroke-dashoffset: 20;
    transition: stroke-dashoffset 0.25s ease;
  }

  .task input:checked + .check {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 12px rgba(139, 92, 246, 0.7);
  }

  .task input:checked + .check svg {
    stroke-dashoffset: 0;
  }

  .task input:focus-visible + .check {
    outline: 2px solid var(--accent-soft);
    outline-offset: 2px;
  }

  .task-text {
    font-size: 15.5px;
    transition: color 0.2s ease;
  }

  .task input:checked ~ .task-text {
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-color: rgba(196, 181, 253, 0.5);
  }

  /* ---------- Раздел DayZ Server ---------- */
  .cat-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 22px;
  }

  .cat-tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 16px 8px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    color: var(--text);
    font: inherit;
    cursor: pointer;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }

  .cat-tab:hover {
    border-color: var(--border-strong);
    box-shadow: var(--glow);
  }

  .cat-tab[aria-selected="true"] {
    border-color: var(--accent);
    background: linear-gradient(160deg, rgba(139, 92, 246, 0.32), var(--card));
    box-shadow: var(--glow);
  }

  .cat-tab:focus-visible {
    outline: 2px solid var(--accent-soft);
    outline-offset: 3px;
  }

  .cat-icon {
    font-size: 28px;
    line-height: 1;
  }

  .cat-title {
    font-weight: 700;
    font-size: 16px;
  }

  .cat-count {
    color: var(--muted);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }

  .cat-tab[aria-selected="true"] .cat-count { color: var(--accent-soft); }

  .mods {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr));
    gap: 20px;
  }

  .mod-img {
    display: block;
    width: calc(100% + 44px);
    margin: -22px -22px 18px;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    border-radius: var(--radius) var(--radius) 0 0;
    border-bottom: 1px solid var(--border);
  }

  .status {
    display: inline-block;
    margin-bottom: 6px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
    border: 1px solid var(--border);
  }

  .status-ready { background: var(--accent); border-color: var(--accent); color: #fff; }
  .status-wip   { background: rgba(139, 92, 246, 0.16); color: var(--accent-soft); border-color: var(--border-strong); }
  .status-plan  { background: rgba(13, 6, 24, 0.55); color: var(--muted); }

  .mod-desc {
    margin-top: 14px;
    color: var(--text);
    font-size: 15.5px;
    text-wrap: pretty;
  }

  .mod-features {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .mod-features li {
    position: relative;
    padding-left: 20px;
    color: var(--muted);
    font-size: 15px;
  }

  .mod-features li::before {
    content: "";
    position: absolute;
    left: 2px;
    top: 0.55em;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    background: var(--accent);
    transform: rotate(45deg);
    box-shadow: 0 0 8px rgba(139, 92, 246, 0.8);
  }

  .empty {
    grid-column: 1 / -1;
    padding: 40px 20px;
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius);
    text-align: center;
    color: var(--muted);
  }

  .empty-icon {
    display: block;
    font-size: 34px;
    margin-bottom: 10px;
    opacity: 0.8;
  }

  .empty strong {
    display: block;
    color: var(--text);
    font-size: 17px;
    margin-bottom: 4px;
  }

  /* ---------- Низ страницы ---------- */
  .actions {
    display: flex;
    justify-content: center;
    padding: 28px 0 12px;
  }

  .btn {
    font: inherit;
    font-weight: 600;
    font-size: 15px;
    padding: 12px 22px;
    border-radius: 12px;
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--accent-soft);
    cursor: pointer;
    transition: background 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
  }

  .btn:hover {
    background: rgba(139, 92, 246, 0.15);
    box-shadow: var(--glow);
    color: var(--text);
  }

  .btn:focus-visible {
    outline: 2px solid var(--accent-soft);
    outline-offset: 3px;
  }

  footer {
    margin-top: 28px;
    padding: 28px 0 36px;
    border-top: 1px solid var(--border);
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  .discord {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding: 11px 20px;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
    transition: box-shadow 0.2s ease, transform 0.2s ease;
  }

  .discord:hover {
    box-shadow: 0 8px 30px -6px rgba(139, 92, 246, 0.9);
    transform: translateY(-1px);
  }

  .discord svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  /* ---------- Телефоны ---------- */
  @media (max-width: 560px) {
    header { padding: 32px 0 28px; }
    .seg a { padding: 8px 12px; font-size: 14px; }
    .cat-tabs { gap: 8px; }
    .cat-tab { padding: 14px 4px 12px; }
    .cat-icon { font-size: 24px; }
    .cat-title { font-size: 14.5px; }
    .mod-img { width: calc(100% + 32px); margin: -18px -16px 16px; }
    .card { padding: 18px 16px 14px; }
    .icon { width: 44px; height: 44px; font-size: 22px; border-radius: 12px; }
    .card-head { gap: 12px; }
    .counter { font-size: 13px; padding: 4px 9px; }
    .task label { padding: 9px 8px; margin: 0 -8px; }
    .overall { padding: 16px; }
  }

  @media (max-width: 400px) {
    .brand { display: none; }
    .seg { flex: 1; }
    .seg a { flex: 1; justify-content: center; }
  }
</style>
</head>
<body>

<nav class="topnav" aria-label="Разделы">
  <div class="topnav-inner">
    <span class="brand" id="brandName"></span>
    <div class="seg">
      <a href="#roadmap" data-view="roadmap"><span aria-hidden="true">🗺️</span>Дорожная карта</a>
      <a href="#server" data-view="server"><span aria-hidden="true">🎮</span>DayZ Server</a>
    </div>
  </div>
</nav>

<div class="wrap">
 <div class="view" id="view-roadmap">
  <header>
    <span class="badge"><span class="dot"></span>DayZ · план развития</span>
    <h1>Дорожная карта сервера <span class="name" id="serverName"></span></h1>
    <p class="subtitle">Что уже сделано и что ждёт сервер впереди: от железа и своих модов до Discord и автодоната.</p>

    <div class="overall">
      <div class="overall-top">
        <span class="overall-label">Общий прогресс</span>
        <span class="overall-count" id="overallCount">0 / 0</span>
      </div>
      <div class="bar" role="progressbar" aria-label="Общий прогресс" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="overallBar">
        <div class="bar-fill" id="overallFill"></div>
      </div>
    </div>
  </header>

  <main class="roadmap" id="roadmap"></main>

  <div class="actions">
    <button class="btn" type="button" id="resetBtn">Сбросить прогресс</button>
  </div>
 </div>

 <div class="view" id="view-server" hidden>
  <header>
    <span class="badge"><span class="dot"></span><span id="serverBadge"></span></span>
    <h1>DayZ Server</h1>
    <p class="subtitle">Мои моды, сделанные специально для сервера: транспорт, одежда и снаряжение.</p>
  </header>

  <div class="cat-tabs" role="tablist" aria-label="Категории модов" id="catTabs"></div>
  <section class="mods" role="tabpanel" id="modList" aria-live="polite"></section>
 </div>

  <footer>
    <a class="discord" id="discordLink" href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.3 4.4A19.7 19.7 0 0 0 15.4 3l-.6 1.3a18.3 18.3 0 0 0-5.6 0L8.6 3a19.6 19.6 0 0 0-4.9 1.4C.6 9 -.3 13.6.2 18.1a19.8 19.8 0 0 0 6 3l1.3-2a12.8 12.8 0 0 1-2-1l.5-.4a14.1 14.1 0 0 0 12 0l.5.4c-.6.4-1.3.7-2 1l1.3 2a19.7 19.7 0 0 0 6-3c.6-5.2-.8-9.7-3.5-13.7ZM8.5 15.3c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.2 1.1 2.1 2.4c0 1.3-.9 2.4-2.1 2.4Zm7 0c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.2 1.1 2.1 2.4c0 1.3-.9 2.4-2.1 2.4Z"/></svg>
      Наш Discord
    </a>
    <div id="footerText"></div>
  </footer>
</div>

<script>
/* =====================================================================
   НАСТРОЙКИ — меняй здесь
   ===================================================================== */

// Название сервера (подставляется в заголовок и подвал)
const SERVER_NAME = "DawnLine";

// Ссылка на Discord (пока заглушка)
const DISCORD_URL = "#";

/*
  План развития. Каждый пункт — карточка:
    id    — уникальный ключ (латиницей), по нему сохраняется прогресс
    icon  — emoji
    title — заголовок
    note  — (необязательно) короткое пояснение под заголовком
    tasks — подпункты: { id: "уникальный-ключ", text: "текст" }

  Чтобы добавить пункт — скопируй блок { ... } и поменяй id и текст.
  Если поменять id подпункта, его галочка сбросится.
*/
const ROADMAP = [
  {
    id: "minipc",
    icon: "🖥️",
    title: "Купить мини-ПК для DayZ-сервера",
    tasks: [
      { id: "minipc-setup", text: "Дать Claude полный доступ к мини-ПК, пробросить порты и настроить всё, чтобы на сервер могли заходить все игроки" }
    ]
  },
  {
    id: "mods",
    icon: "🛠️",

/* =====================================================================
   Дальше — логика страницы, менять не обязательно
   ===================================================================== */

const STORAGE_KEY = "dayz-roadmap-progress-v1";

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const data = raw ? JSON.parse(raw) : {};
    return data && typeof data === "object" ? data : {};
  } catch (e) {
    return {};
  }
}

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  } catch (e) {
    /* хранилище недоступно — прогресс просто не сохранится */
  }
}

let progress = loadProgress();

const CHECK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="5 12.5 10 17 19 7"/></svg>';

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function render() {
  const root = document.getElementById("roadmap");
  root.innerHTML = ROADMAP.map((item, i) => `
    <section class="card reveal" data-card="${escapeHtml(item.id)}">
      <div class="card-head">
        <div class="icon" aria-hidden="true">${item.icon || "⭐"}</div>
        <div class="head-text">
          <span class="num">Этап ${String(i + 1).padStart(2, "0")}</span>
          <h2 class="card-title">${escapeHtml(item.title)}</h2>
        </div>
        <span class="counter" data-counter></span>
      </div>
      ${item.note ? `<p class="card-note">${escapeHtml(item.note)}</p>` : ""}
      <div class="mini-bar"><div class="mini-fill" data-mini></div></div>
      <ul class="tasks">
        ${item.tasks.map(task => `
          <li class="task">
            <label>
              <input type="checkbox" data-task="${escapeHtml(task.id)}" ${progress[task.id] ? "checked" : ""}>
              <span class="check">${CHECK_SVG}</span>
              <span class="task-text">${escapeHtml(task.text)}</span>
            </label>
          </li>`).join("")}
      </ul>
    </section>
  `).join("");

  updateCounters();
  observeReveal();
}

function updateCounters() {
  let total = 0;
  let done = 0;

  ROADMAP.forEach(item => {
    const card = document.querySelector(`[data-card="${CSS.escape(item.id)}"]`);
    if (!card) return;
    const cardDone = item.tasks.filter(t => progress[t.id]).length;
    const cardTotal = item.tasks.length;
    total += cardTotal;
    done += cardDone;

    card.querySelector("[data-counter]").textContent = `${cardDone}/${cardTotal}`;
    card.querySelector("[data-mini]").style.width = cardTotal ? `${(cardDone / cardTotal) * 100}%` : "0";
    card.classList.toggle("complete", cardTotal > 0 && cardDone === cardTotal);
  });

  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById("overallCount").textContent = `${done} / ${total} · ${pct}%`;
  document.getElementById("overallFill").style.width = `${pct}%`;
  document.getElementById("overallBar").setAttribute("aria-valuenow", String(pct));
}

function observeReveal() {
  const cards = document.querySelectorAll(".reveal:not(.observed)");
  cards.forEach(c => c.classList.add("observed"));
  if (!("IntersectionObserver" in window)) {
    cards.forEach(c => c.classList.add("visible"));
    return;
  }
  const io = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add("visible");
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
  cards.forEach((c, i) => {
    c.style.transitionDelay = `${Math.min(i, 4) * 60}ms`;
    c.addEventListener("transitionend", () => { c.style.transitionDelay = "0ms"; }, { once: true });
    io.observe(c);
  });
}

document.getElementById("roadmap").addEventListener("change", e => {
  const id = e.target.dataset && e.target.dataset.task;
  if (!id) return;
  if (e.target.checked) progress[id] = true;
  else delete progress[id];
  saveProgress();
  updateCounters();
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("Сбросить весь прогресс? Все отметки будут сняты.")) return;
  progress = {};
  saveProgress();
  document.querySelectorAll("[data-task]").forEach(cb => { cb.checked = false; });
  updateCounters();
});

/* ---------- Раздел DayZ Server ---------- */

const STATUS_LABELS = { ready: "Готово", wip: "В разработке", plan: "В планах" };
const CAT_KEY = "dayz-mods-category-v1";

function loadCategory() {
  try {
    const saved = localStorage.getItem(CAT_KEY);
    if (MOD_CATEGORIES.some(c => c.id === saved)) return saved;
  } catch (e) { /* нет доступа к хранилищу */ }
  return MOD_CATEGORIES[0].id;
}

let currentCategory = loadCategory();

function modsWord(n) {
  const n10 = n % 10, n100 = n % 100;
  if (n10 === 1 && n100 !== 11) return "мод";
  if (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) return "мода";
  return "модов";
}

function renderCategoryTabs() {
  document.getElementById("catTabs").innerHTML = MOD_CATEGORIES.map(cat => {
    const count = MODS.filter(m => m.category === cat.id).length;
    const selected = cat.id === currentCategory;
    return `
      <button class="cat-tab" type="button" role="tab" id="tab-${escapeHtml(cat.id)}"
              aria-controls="modList" aria-selected="${selected}" tabindex="${selected ? 0 : -1}"
              data-cat="${escapeHtml(cat.id)}">
        <span class="cat-icon" aria-hidden="true">${cat.icon}</span>
        <span class="cat-title">${escapeHtml(cat.title)}</span>
        <span class="cat-count">${count} ${modsWord(count)}</span>
      </button>`;
  }).join("");
}

function renderMods() {
  const list = document.getElementById("modList");
  list.setAttribute("aria-labelledby", `tab-${currentCategory}`);
  const mods = MODS.filter(m => m.category === currentCategory);

  if (!mods.length) {
    list.innerHTML = `
      <div class="empty">
        <span class="empty-icon" aria-hidden="true">🛠️</span>
        <strong>Пока пусто</strong>
        Скоро здесь появятся мои моды для этого раздела.
      </div>`;
    return;
  }

  list.innerHTML = mods.map(mod => {
    const status = STATUS_LABELS[mod.status] ? mod.status : "plan";
    const features = (mod.features || []).map(f => `<li>${escapeHtml(f)}</li>`).join("");
    return `
      <article class="card reveal">
        ${mod.image ? `<img class="mod-img" src="${escapeHtml(mod.image)}" alt="${escapeHtml(mod.name)}" loading="lazy">` : ""}
        <div class="card-head">
          <div class="icon" aria-hidden="true">${mod.icon || "📦"}</div>
          <div class="head-text">
            <span class="status status-${status}">${STATUS_LABELS[status]}</span>
            <h2 class="card-title">${escapeHtml(mod.name)}</h2>
          </div>
        </div>
        ${mod.description ? `<p class="mod-desc">${escapeHtml(mod.description)}</p>` : ""}
        ${features ? `<ul class="mod-features">${features}</ul>` : ""}
      </article>`;
  }).join("");
  observeReveal();
}

function selectCategory(id, focus) {
  currentCategory = id;
  try { localStorage.setItem(CAT_KEY, id); } catch (e) { /* не страшно */ }
  renderCategoryTabs();
  renderMods();
  if (focus) document.getElementById(`tab-${id}`).focus();
}

document.getElementById("catTabs").addEventListener("click", e => {
  const tab = e.target.closest("[data-cat]");
  if (tab) selectCategory(tab.dataset.cat, false);
});

document.getElementById("catTabs").addEventListener("keydown", e => {
  const i = MOD_CATEGORIES.findIndex(c => c.id === currentCategory);
  let next = null;
  if (e.key === "ArrowRight") next = (i + 1) % MOD_CATEGORIES.length;
  if (e.key === "ArrowLeft") next = (i - 1 + MOD_CATEGORIES.length) % MOD_CATEGORIES.length;
  if (next === null) return;
  e.preventDefault();
  selectCategory(MOD_CATEGORIES[next].id, true);
});

/* ---------- Переключение разделов ---------- */

function showView() {
  const view = location.hash === "#server" ? "server" : "roadmap";
  document.getElementById("view-roadmap").hidden = view !== "roadmap";
  document.getElementById("view-server").hidden = view !== "server";
  document.querySelectorAll("[data-view]").forEach(a => {
    if (a.dataset.view === view) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  document.title = view === "server"
    ? `DayZ Server · ${SERVER_NAME}`
    : `Дорожная карта сервера ${SERVER_NAME}`;
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", showView);

document.getElementById("brandName").textContent = SERVER_NAME;
document.getElementById("serverBadge").textContent = `${SERVER_NAME} · мои моды`;
document.getElementById("serverName").textContent = SERVER_NAME;
document.getElementById("discordLink").href = DISCORD_URL;
document.getElementById("footerText").textContent = `© ${new Date().getFullYear()} ${SERVER_NAME} · DayZ-сервер`;

render();
renderCategoryTabs();
renderMods();
showView();
</script>
